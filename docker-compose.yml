services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financeiro}
      POSTGRES_USER: ${POSTGRES_USER:-financeiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeiro_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./back-end/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financeiro} -d ${POSTGRES_DB:-financeiro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  back-end:
    build: ./back-end
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-financeiro}:${POSTGRES_PASSWORD:-financeiro_dev}@database:5432/${POSTGRES_DB:-financeiro}
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-por-uma-chave-longa-e-aleatoria}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  front-end:
    build: ./front-end
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - "5173:5173"
    depends_on:
      back-end:
        condition: service_healthy

volumes:
  postgres_data:
